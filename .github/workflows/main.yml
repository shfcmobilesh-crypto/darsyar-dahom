
name: Build Darsyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive
        uses: actions/checkout@v4

      - name: Extract Flutter source
        run: |
          mkdir -p app
          unzip -o darsyar_dahom_source.zip -d app
          find app -name pubspec.yaml

      - name: Check Flutter project
        run: |
          if ! find app -name pubspec.yaml | grep -q .; then
            echo "pubspec.yaml not found in source archive"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find app -name pubspec.yaml | head -n 1)")"
          cd "$PROJECT_DIR"
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-dahom-apk
          path: app/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
